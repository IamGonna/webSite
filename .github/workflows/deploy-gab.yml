name: Deploy GAB

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy public folder to VPS
        env:
          DEPLOY_HOST: ${{ secrets.GAB_VPS_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.GAB_VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST" || { echo "ERROR: le secret GAB_VPS_HOST est absent." >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "ERROR: le secret GAB_VPS_SSH_KEY est absent." >&2; exit 1; }

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Vérification de l’hôte SSH et de la cible de déploiement…"
          ssh-keyscan -T 15 -p 54321 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh -p 54321 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "gitgabpull@$DEPLOY_HOST" \
            'test -d /home/docker/web/gab/html && test -w /home/docker/web/gab/html'

          echo "Synchronisation du site Hugo…"
          rsync -az --delete --itemize-changes \
            -e "ssh -p 54321 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15" \
            public/ \
            "gitgabpull@$DEPLOY_HOST:/home/docker/web/gab/html/"

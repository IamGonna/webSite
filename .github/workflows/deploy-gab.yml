name: Deploy GAB

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build Hugo site
        run: hugo --minify

      - name: Deploy public folder to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GAB_VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 54321 -H "${{ secrets.GAB_VPS_HOST }}" >> ~/.ssh/known_hosts

          rsync -az --delete \
            -e "ssh -p 54321 -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            public/ \
            gitgabpull@${{ secrets.GAB_VPS_HOST }}:/home/docker/web/gab/html/
